services:
  - type: web
    name: paisa-tracker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - {key: SECRET_KEY, generateValue: true}
      - {key: DEBUG, value: "0"}
      - {key: ALLOWED_HOSTS, value: ".onrender.com"}
      - {key: CSRF_TRUSTED_ORIGINS, value: "https://*.onrender.com"}
      - {key: PYTHON_VERSION, value: "3.12.3"}
