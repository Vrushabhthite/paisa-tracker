{% extends "tracker/base.html" %}{% block content %}
<div class="card p-4 mx-auto" style="max-width:520px"><h5>{{ title }}</h5>
<form method="post">{% csrf_token %}
{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
<small class="text-muted">{{ f.help_text }}</small><div class="text-danger small">{{ f.errors }}</div></div>{% endfor %}
<button class="btn btn-success">Save</button> <a class="btn btn-link" href="{% url 'history' %}">Cancel</a></form></div>
{% endblock %}
