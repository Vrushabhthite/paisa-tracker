<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Paisa Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>.big{font-size:2.2rem;font-weight:700}.neg{color:#c0392b}.pos{color:#1e8449}</style></head><body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4"><div class="container">
<a class="navbar-brand" href="/">💰 Paisa Tracker</a>
{% if user.is_authenticated %}<div class="d-flex gap-2">
<a class="btn btn-sm btn-success" href="{% url 'add' %}">+ Add</a>
<a class="btn btn-sm btn-outline-light" href="{% url 'history' %}">History</a>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Logout</button></form></div>{% endif %}
</div></nav><div class="container pb-5">{% block content %}{% endblock %}</div></body></html>
